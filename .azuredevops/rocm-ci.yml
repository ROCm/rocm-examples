variables:
- group: common
- template: /.azuredevops/variables-global.yml@pipelines_repo

parameters:
- name: pipelinesRepoRef
  type: string
  default: refs/heads/develop

resources:
  repositories:
  - repository: pipelines_repo
    type: github
    endpoint: ROCm
    name: ROCm/ROCm
    ref: ${{ parameters.pipelinesRepoRef }}

trigger:
  batch: true
  branches:
    include:
    - amd-staging
    - amd-mainline
  paths:
    exclude:
    - .githooks
    - .github
    - .gitlab
    - Dockerfiles
    - Docs
    - Scripts
    - '.*.y*ml'
    - '*.md'
    - '*.sln'

pr:
  autoCancel: true
  branches:
    include:
    - amd-staging
    - amd-mainline
  paths:
    exclude:
    - .githooks
    - .github
    - .gitlab
    - Dockerfiles
    - Docs
    - Scripts
    - '.*.y*ml'
    - '*.md'
    - '*.sln'
  drafts: false

jobs:
  - template: ${{ variables.CI_COMPONENT_PATH }}/rocm-examples.yml@pipelines_repo
