name: Build Systems CUDA

on:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Systems/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Systems/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
    DEBIAN_FRONTEND: noninteractive
    ROCM_VERSION: '7.2'
    AMDGPU_INSTALLER_VERSION: 7.2.70200-1
    HIPFILE_BASE_URL: https://github.com/ROCm/hipFile/releases/download/nightly

jobs:
    build:
        name: "Build Systems CUDA"
        runs-on: ubuntu-latest
        container:
            image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
            options: --user root
        defaults:
            run:
                shell: bash
        steps:
          - uses: actions/checkout@v4

          - name: Install dependencies
            run: |
                  apt-get update -qq &&
                  apt-get install -y build-essential g++ cmake \
                    locales wget git pkg-config libmount-dev rsync

          - name: Install cuFile (CUDA GDS)
            run: |
                  apt-get update -qq &&
                  apt-get install -y libcufile-dev
                  rm -rf /var/lib/apt/lists/*

          - name: Install Hip for CUDA
            run: |
              wget https://repo.radeon.com/amdgpu-install/${{ env.ROCM_VERSION }}/ubuntu/noble/amdgpu-install_${{ env.AMDGPU_INSTALLER_VERSION }}_all.deb
              apt-get -y install ./amdgpu-install_${{ env.AMDGPU_INSTALLER_VERSION }}_all.deb &&
              apt-get update -qq &&
              apt-get install -y hip-dev hipify-clang
              echo "/opt/rocm/bin" >> $GITHUB_PATH
              echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
              echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

          - name: Install hipFile nightly packages
            run: |
                  wget ${{ env.HIPFILE_BASE_URL }}/hipfile_0.2.0.70200-nightly.9999.24.04_amd64.deb
                  wget ${{ env.HIPFILE_BASE_URL }}/hipfile-dev_0.2.0.70200-nightly.9999.24.04_amd64.deb
                  apt-get install -y ./hipfile_0.2.0.70200-nightly.9999.24.04_amd64.deb \
                                     ./hipfile-dev_0.2.0.70200-nightly.9999.24.04_amd64.deb

          - name: Configure and Build
            run: |
              cd Systems && mkdir build && cd build
              cmake -DROCM_EXAMPLES_GPU_LANGUAGE=CUDA -DHIP_PLATFORM=nvidia ..
              cmake --build . -j $(nproc)
