name: pre-commit

# Lint workflows and enforce SHA-pinned GitHub Actions on every PR and on
# pushes to the mainline. Runs the hooks in .pre-commit-config.yaml
# (whitespace/EOF, YAML + merge-conflict checks, actionlint, check-gha-pinning).

on:
  pull_request:
  push:
    branches:
      - amd-staging

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
