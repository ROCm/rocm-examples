name: pre-commit

# Run the repo's pre-commit hooks on every PR and on pushes to the
# mainline. Runs the hooks in .pre-commit-config.yaml
# (whitespace/EOF, YAML + merge-conflict checks, actionlint).

on:
  pull_request:
  push:
    branches:
      - amd-staging

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
