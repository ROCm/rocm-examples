name: Nightly CI

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      gpu_config:
        description: "GPU configuration"
        required: true
        default: all
        type: choice
        options:
        - all
        - gfx1100
        - gfx1151
      install_method:
        description: "Installation method"
        required: true
        default: all
        type: choice
        options:
        - all
        - whl-multi-arch
        - tarball-multi-arch
      distro:
        description: "Distro to build"
        required: true
        default: all
        type: choice
        options:
        - all
        - ubuntu-24.04
        - ubuntu-26.04
        - sles-15.7
        - almalinux-8
        - stable_release
      rocm_version:
        description: "ROCm version to install: a nightly (e.g. 10.3.0a20261030) or a release candidate (e.g. 10.2.0rc0). Empty = latest nightly. Skips the stable_release image."
        required: false
        default: ""
        type: string
      enable_ck:
        description: "Build and test the Composable Kernel examples"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      gpu_configs: ${{ steps.config.outputs.gpu_configs }}
      install_methods: ${{ steps.config.outputs.install_methods }}
      distros: ${{ steps.config.outputs.distros }}
      distro_map: ${{ steps.config.outputs.distro_map }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure CI
        id: config
        env:
          GPU_CONFIG: ${{ github.event.inputs.gpu_config }}
          INSTALL_METHOD: ${{ github.event.inputs.install_method }}
          DISTRO: ${{ github.event.inputs.distro }}
          ROCM_VERSION: ${{ github.event.inputs.rocm_version }}
        # The stable_release image ships its own ROCm, so it cannot install a requested version.
        run: python3 .github/build_tools/configure_ci.py ${ROCM_VERSION:+--exclude-preinstalled}

  build:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.setup.outputs.distros) }}
    uses: ./.github/workflows/build-rocm-examples-reusable.yml
    with:
      distro: ${{ matrix.distro }}
      distro_map: ${{ needs.setup.outputs.distro_map }}
      gpu_configs: ${{ needs.setup.outputs.gpu_configs }}
      install_methods: ${{ needs.setup.outputs.install_methods }}
      rocm_version: ${{ github.event.inputs.rocm_version }}
      enable_ck: ${{ github.event.inputs.enable_ck == 'true' }}
