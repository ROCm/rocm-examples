name: Build ROCm Examples

on:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Applications/**'
      - 'HIP-Basic/**'
      - 'HIP-Doc/**'
      - 'Libraries/**'
      - 'Programming-Guide/**'
      - 'Tools/**'
      - 'Tutorials/**'
      - 'Common/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Applications/**'
      - 'HIP-Basic/**'
      - 'HIP-Doc/**'
      - 'Libraries/**'
      - 'Programming-Guide/**'
      - 'Tools/**'
      - 'Tutorials/**'
      - 'Common/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      gpu_config:
        description: "GPU configuration"
        required: true
        default: all
        type: choice
        options:
        - all
        - gfx1100
        - gfx1151
      install_method:
        description: "Installation method (only applies to legacy distros; baked-ROCm distros ignore this)"
        required: true
        default: all
        type: choice
        options:
        - all
        - wheel
        - tarball
      distro:
        description: "Distro to build"
        required: true
        default: all
        type: choice
        options:
        - all
        - ubuntu-22.04
        - ubuntu-24.04
        - ubuntu-26.04
        - sles-15.7
        - almalinux-8
        - rocky-9
        - rhel-10.1
        - oracle-10

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      gpu_configs: ${{ steps.config.outputs.gpu_configs }}
      install_methods: ${{ steps.config.outputs.install_methods }}
      distros: ${{ steps.config.outputs.distros }}
      distro_map: ${{ steps.config.outputs.distro_map }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CI
        id: config
        env:
          GPU_CONFIG: ${{ github.event.inputs.gpu_config || 'all' }}
          INSTALL_METHOD: ${{ github.event.inputs.install_method || 'all' }}
          DISTRO: ${{ github.event.inputs.distro || 'ubuntu-22.04' }}
        run: python3 .github/build_tools/configure_ci.py

  build:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.setup.outputs.distros) }}
    uses: ./.github/workflows/build-rocm-examples-reusable.yml
    with:
      distro: ${{ matrix.distro }}
      distro_map: ${{ needs.setup.outputs.distro_map }}
      gpu_configs: ${{ needs.setup.outputs.gpu_configs }}
      install_methods: ${{ needs.setup.outputs.install_methods }}
    secrets: inherit
