name: Build ROCm tool examples

on:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Tools/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
    GPU_TARGETS: gfx908;gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1200;gfx1201

jobs:
    build:
        name: "Build ROCm tool examples"
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/rocm/rocm-examples-ubuntu-24.04-rocm:7.14
        defaults:
            run:
                shell: bash
        steps:
          - uses: actions/checkout@v4
          - name: CMake Configure and Build
            run: |
              cd Tools
              cmake -DGPU_TARGETS="${GPU_TARGETS}" -S . -B build
              cmake --build build -j
          - name: Make
            run: |
              cd Tools
              make -j
