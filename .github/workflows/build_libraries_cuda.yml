name: Build Libraries CUDA

on:
  workflow_dispatch:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Libraries/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Libraries/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
    DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "Build Libraries CUDA"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      # ghcr.io/rocm/rocm-examples-hip-libraries-cuda-ubuntu:latest
      image: ghcr.io/rocm/rocm-examples-hip-libraries-cuda-ubuntu@sha256:151e63ddfef9798457e5321d6466f8e0168a9caedd92cc4469fbfe62e645701f
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build hipCUB example
        run: |
          cd Libraries/hipCUB
          make GPU_RUNTIME=CUDA -j

      - name: Build hipFFT example
        run: |
          cd Libraries/hipFFT
          make GPU_RUNTIME=CUDA -j

      - name: Build hipSPARSELt examples
        run: |
          cd Libraries/hipSPARSELt
          make GPU_RUNTIME=CUDA -j

      - name: Build rocRAND example
        run: |
          cd Libraries/rocRAND
          make GPU_RUNTIME=CUDA -j
