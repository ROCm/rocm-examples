name: Build ROCm Examples (Reusable)

on:
  workflow_call:
    inputs:
      distro:
        description: "Distro key (e.g. ubuntu-22.04)"
        required: true
        type: string
      distro_map:
        description: "JSON map of distro key to {image, label}"
        required: true
        type: string
      gpu_configs:
        description: "JSON array of GPU configurations"
        required: true
        type: string
      install_methods:
        description: "JSON array of install methods (fallback for distros without per-distro override)"
        required: true
        type: string
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "${{ fromJson(inputs.distro_map)[inputs.distro].label }} - ${{ matrix.gpu_config.gpu_target }} - ${{ matrix.install_method }}"
    runs-on: [self-hosted, Linux, "${{ matrix.gpu_config.therock_family }}"]
    container:
      image: ${{ fromJson(inputs.distro_map)[inputs.distro].image }}
      options:
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        install_method: ${{ fromJson(inputs.distro_map)[inputs.distro].install_methods }}
        gpu_config: ${{ fromJson(inputs.gpu_configs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ROCm (whl-multi-arch)
        if: ${{ matrix.install_method == 'whl-multi-arch' }}
        run: |
          echo "## Target: ${{ matrix.gpu_config.gpu_target }} on ${{ fromJson(inputs.distro_map)[inputs.distro].label }}" >> $GITHUB_STEP_SUMMARY
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/ \
            "rocm[libraries,devel,device-${{ matrix.gpu_config.gpu_target }}]"
          rocm-sdk init

      - name: Wheel sanity check
        if: ${{ matrix.install_method == 'whl-multi-arch' }}
        id: sanity-check
        continue-on-error: true
        run: |
          ROCM_VERSION=$(rocm-sdk version)
          echo "rocm_version=${ROCM_VERSION}" >> $GITHUB_OUTPUT
          echo "## ROCm Version: ${ROCM_VERSION}" >> $GITHUB_STEP_SUMMARY
          rocm-sdk init
          rocm-sdk test

      - name: Setup environment variables (whl-multi-arch)
        if: ${{ matrix.install_method == 'whl-multi-arch' }}
        id: whl-multiarch-version
        run: python3 .github/build_tools/setup_whl_env.py

      - name: Install TheRock tarball (multi-arch)
        if: ${{ matrix.install_method == 'tarball-multi-arch' }}
        id: install-tarball-multi-arch
        run: |
          TARBALL_LISTING=$(curl -s -H "Cache-Control: no-cache" -H "Pragma: no-cache" https://rocm.nightlies.amd.com/tarball-multi-arch/ \
            | grep -oE "therock-dist-linux-${{ matrix.gpu_config.therock_family }}-[0-9]+\.[0-9]+\.\w+\.tar\.gz")
          LATEST_TARBALL=$(echo "${TARBALL_LISTING}" | sort -V | tail -1)
          mkdir /therock-tarball && cd /therock-tarball
          wget "https://rocm.nightlies.amd.com/tarball-multi-arch/${LATEST_TARBALL}"
          mkdir install
          tar -xzf "${LATEST_TARBALL}" -C install

          ROCM_VERSION=$(echo "${LATEST_TARBALL}" | grep -oE "[0-9]+\.[0-9]+\.\w+")
          echo "rocm_version=${ROCM_VERSION}" >> $GITHUB_OUTPUT
          echo "## ROCm Version: ${ROCM_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "## Tarball link: https://rocm.nightlies.amd.com/tarball-multi-arch/${LATEST_TARBALL}" >> $GITHUB_STEP_SUMMARY

      - name: Setup environment variables (tarball-multi-arch)
        if: ${{ matrix.install_method == 'tarball-multi-arch' }}
        run: |
          ROCM_PATH=/therock-tarball/install
          echo "ROCM_PATH=${ROCM_PATH}" >> $GITHUB_ENV
          echo "HIP_PATH=${ROCM_PATH}" >> $GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=${ROCM_PATH}/lib/llvm/amdgcn/bitcode" >> $GITHUB_ENV
          echo "PATH=${ROCM_PATH}/bin:${ROCM_PATH}/llvm/bin:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${ROCM_PATH}/lib:${ROCM_PATH}/llvm/lib:${ROCM_PATH}/lib/rocprofiler-systems:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "ENABLE_OPENMP=ON" >> $GITHUB_ENV
          echo "HIPCC_COMPILE_FLAGS_APPEND=--offload-arch=${{ matrix.gpu_config.gpu_target }}" >> $GITHUB_ENV

      - name: Makefile build
        run: |
          ./Scripts/configure.sh --rocm-path="${ROCM_PATH}"
          make -j HIP_ARCHITECTURES="${{ matrix.gpu_config.gpu_target }}"

      - name: CMake configure
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build -DCMAKE_HIP_ARCHITECTURES="${{ matrix.gpu_config.gpu_target }}" -DCMAKE_BUILD_RPATH="${ROCM_PATH}/lib" -DROCM_EXAMPLES_ENABLE_OPENMP="${ENABLE_OPENMP}" 2> >(tee cmake_error.log >&2)

      - name: CMake configure error summary
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f cmake_error.log ]; then
            exit 0
          fi

          echo "## CMake Configure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          WARNINGS=$(grep -ci "warning" cmake_error.log || true)
          ERRORS=$(grep -ci "error" cmake_error.log || true)

          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | ${WARNINGS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | ${ERRORS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -s cmake_error.log ]; then
            echo "<details><summary>CMake error log</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat cmake_error.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "Clean configure - no warnings or errors" >> $GITHUB_STEP_SUMMARY
          fi

      - name: CMake build
        if: ${{ !cancelled() }}
        run: |
          cmake --build build -j

      - name: CMake install
        if: ${{ !cancelled() }}
        run: |
          cmake --install build --prefix install

      - name: Collect Makefile build artifacts
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/makefile_build
          find . -name Makefile -not -path './build/*' | while IFS= read -r makefile; do
            dir=$(dirname "$makefile")
            example_name=$(grep '^EXAMPLE := ' "$makefile" 2>/dev/null | head -1 | sed 's/^EXAMPLE := //' || true)
            if [ -n "${example_name}" ] && [ -x "${dir}/${example_name}" ]; then
              mkdir -p "/tmp/makefile_build/${dir}"
              cp "${dir}/${example_name}" "/tmp/makefile_build/${dir}/"
            fi
          done

      - name: Upload CMake build artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rocm-examples-build-${{ inputs.distro }}-${{ matrix.gpu_config.gpu_target }}-${{ steps.whl-multiarch-version.outputs.rocm_version || steps.install-tarball-multi-arch.outputs.rocm_version }}-${{ matrix.install_method }}
          path: build/

      - name: Upload Makefile build artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: makefile-build-${{ inputs.distro }}-${{ matrix.gpu_config.gpu_target }}-${{ steps.whl-multiarch-version.outputs.rocm_version || steps.install-tarball-multi-arch.outputs.rocm_version }}-${{ matrix.install_method }}
          path: /tmp/makefile_build/

      - name: Run tests
        if: ${{ !cancelled() }}
        run: |
          python3 .github/build_tools/generate_skip_tests.py --target ${{ matrix.gpu_config.gpu_target }} --distro ${{ inputs.distro }}

          SKIP_FILE="${GITHUB_WORKSPACE}/.github/build_tools/skip_tests.txt"
          if [ -s "${SKIP_FILE}" ]; then
            echo "## Skipped tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "${SKIP_FILE}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "No tests skipped." >> $GITHUB_STEP_SUMMARY
          fi

          ctest --test-dir build --output-on-failure --exclude-from-file "${SKIP_FILE}" 2>&1 | tee ctest_output.log

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          LAST_TEST_LOG="build/Testing/Temporary/LastTest.log"
          if [ ! -f ctest_output.log ] || [ ! -f "${LAST_TEST_LOG}" ]; then
            echo "No test logs found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Test summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SUMMARY=$(grep "tests passed" ctest_output.log)
          echo "**${SUMMARY}**" >> $GITHUB_STEP_SUMMARY

          FAILED_LOG="build/Testing/Temporary/LastTestsFailed.log"
          if [ -s "${FAILED_LOG}" ]; then
            echo "## Failed tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "${FAILED_LOG}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "<details><summary>Failed tests output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            awk '
              /^[0-9]+\/[0-9]+ Testing: / { if (inblock && failed) print block; block = $0; inblock = 1; failed = 0; seen_result = 0; next }
              inblock { block = block "\n" $0 }
              /^Test Failed\.$/ { failed = 1; seen_result = 1 }
              /^Test Passed\.$/ { seen_result = 1 }
              /^-+$/ { if (inblock && seen_result) { if (failed) print block; inblock = 0 } }
              END { if (inblock && failed) print block }
            ' "${LAST_TEST_LOG}" >> $GITHUB_STEP_SUMMARY

            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ inputs.distro }}-${{ matrix.gpu_config.gpu_target }}-${{ steps.whl-multiarch-version.outputs.rocm_version || steps.install-tarball-multi-arch.outputs.rocm_version }}-${{ matrix.install_method }}
          path: build/Testing/Temporary/

      - name: Makefile test
        if: ${{ !cancelled() }}
        run: |
          make test HIP_ARCHITECTURES="${{ matrix.gpu_config.gpu_target }}" 2>&1 | tee makefile_test_output.log

      - name: Upload Makefile test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: makefile-test-logs-${{ inputs.distro }}-${{ matrix.gpu_config.gpu_target }}-${{ steps.whl-multiarch-version.outputs.rocm_version || steps.install-tarball-multi-arch.outputs.rocm_version }}-${{ matrix.install_method }}
          path: makefile_test_output.log

      - name: Clean the workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
