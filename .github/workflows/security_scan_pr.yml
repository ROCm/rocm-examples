#
# Pre-commit security gate: fast, PR-side security scanners that run on
# every pull request. The set of scanners lives in `security-baseline.yml`,
# so scanners coming online are picked up here without touching this file.

name: Security scan (PR)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      report_formats: human
