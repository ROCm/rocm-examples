name: Build ROCm Programming Guide CUDA

on:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Programming-Guide/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Programming-Guide/**'
      - '.github/workflows/**'

env:
    DEBIAN_FRONTEND: noninteractive
    ROCM_VERSION: '7.2'
    AMDGPU_INSTALLER_VERSION: 7.2.70200-1

jobs:
    build:
        name: "Build ROCm Programming Guide CUDA"
        runs-on: ubuntu-latest
        container:
            image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04

        steps:
          - uses: actions/checkout@v4

          - name: Install dependencies
            run: |
                  apt-get update -qq &&
                  apt-get install -y build-essential g++ python3 python3-pip locales wget git
                  python3 -m pip install --upgrade pip
                  python3 -m pip install cmake

          - name: Install Hip for CUDA
            run: |
              wget https://repo.radeon.com/amdgpu-install/${{ env.ROCM_VERSION }}/ubuntu/jammy/amdgpu-install_${{ env.AMDGPU_INSTALLER_VERSION }}_all.deb
              apt-get -y install ./amdgpu-install_${{ env.AMDGPU_INSTALLER_VERSION }}_all.deb &&
              apt-get update -qq &&
              apt-get install -y hip-dev hipify-clang

          - name: Configure and Build
            shell: bash
            run: |
              cd Programming-Guide && mkdir build && cd build
              cmake -DROCM_EXAMPLES_GPU_LANGUAGE=CUDA -DHIP_PLATFORM=nvidia ..
              cmake --build . -j
