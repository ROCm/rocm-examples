# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "amd-staging"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Follow the repository's required users/<username>/<description>
    # branch-naming convention.
    pull-request-branch-name:
      prefix: "users/dependabot"
      template: "{prefix}/{name}"
      word-separator: "-"
      branch-name-case: "lowercase"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
