#
# bandit configuration for rocm-examples, picked up by the rocm-security-gh
# reusable scanner (.github/workflows/security_scan_pr.yml and
# security_scan_weekly.yml) in place of its own org-wide default.
# Reference: https://bandit.readthedocs.io/en/latest/config.html

exclude_dirs:
  - .git
  - .venv
  - venv

# Code adapted from upstream projects keeps upstream's assert-based checks
# rather than diverging from the source it was taken from.
assert_used:
  skips:
    # ROCm/composable_kernel example/ck_tile/01_fmha codegen.
    - "*/Libraries/ComposableKernel/attention/fmha/*"
    # jameswdelancey/llama3.c (fork of karpathy/llama2.c).
    - "*/Libraries/hipThreads/llama3c/*"
